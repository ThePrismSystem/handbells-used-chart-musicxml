# Check only what CI checks. Without this, `pnpm spell` also scans the
# git-ignored local-only files (docs/superpowers, .superpowers, CLAUDE.md),
# so it fails locally while passing in CI — which trains people to ignore it.
useGitignore: true
ignorePaths:
  - node_modules
  - dist
  - build
  - coverage
  - pnpm-lock.yaml
  - "*.min.js"
  - "*.min.css"
