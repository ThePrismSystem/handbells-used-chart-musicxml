name: Gitleaks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On pull_request the action enumerates the PR's commits via
      # GET /repos/{owner}/{repo}/pulls/{n}/commits, which 403s without this.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
